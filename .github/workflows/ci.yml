name: CampusConnect CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 3: Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Step 4: Build frontend
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Step 5: Install backend dependencies
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Step 6: Run backend tests
      - name: Run backend tests
        working-directory: backend
        run: npm test --if-present

      # Step 7: Build development Docker images
      - name: Build Docker images
        run: docker compose build

      # Step 8: Setup Docker Buildx
      - name: Setup Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      # Step 9: Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 10: Build and push backend image
      - name: Build and push backend
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            puneeth47/campusconnect-backend:latest
            puneeth47/campusconnect-backend:${{ github.sha }}

      # Step 11: Build and push frontend image
      # Wait until the Render backend URL is configured.
      - name: Build and push frontend
        if: github.event_name == 'push' && vars.VITE_API_URL != ''
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            puneeth47/campusconnect-frontend:latest
            puneeth47/campusconnect-frontend:${{ github.sha }}