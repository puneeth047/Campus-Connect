version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: campus_events_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campus_events
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_events_api
    restart: unless-stopped
    # Reinstall dependencies into the mounted /app/node_modules volume on startup.
    command: sh -c "npm install && npm run dev"
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/campus_events
      ORGANIZER_EMAIL: ${ORGANIZER_EMAIL:-}
      ORGANIZER_PASSWORD: ${ORGANIZER_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-CampusConnect <no-reply@example.com>}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus_events_frontend
    restart: unless-stopped
    # Reinstall dependencies into the mounted /app/node_modules volume on startup.
    command: sh -c "npm install && npm run dev -- --port 3000"
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
